base_binding:
  merged_pr: 747
  merge_commit: 80bf813375d7fc2ab292dfdbcc1db447fdb6684a
  merge_tree: 007e277ca5643f7cb63355961fd0422d92fd4b87
  final_pr: 749
  final_head_must_descend_from_merge_commit: true
normative_classifications:
  - SPFX_SUBJECT_MISSING
  - BFF_REQUEST_NOT_OBSERVED
  - BFF_AUTHENTICATION_REJECTED_401
  - BFF_AUTHORIZATION_REJECTED_403
ports:
  - ClientObservationReceiptPort
  - TeamsTabMetadataReadPort
  - SharePointAppCatalogReadPort
  - EntraApiPermissionReadPort
  - AzureFunctionMetadataReadPort
  - AzureFunctionRequestLogReadPort
  - SharePointAccessDecisionReadPort
required_remote_checks:
  - Privacy and Secrets Guard / secret-scan
  - Privacy and Secrets Guard / privacy-lint
  - NaC Quality Gate / quality-gate
  - NaC Windows Portability / windows-offline-cli
phases:
  - {id: repository_implementation, provider_access: false, mutation: repository_only}
  - {id: client_receipt_stage, provider_access: false, mutation: protected_local_receipt_create_exclusive}
  - {id: final_gate, provider_access: false, mutation: github_approval_only}
  - {id: windows_preflight, provider_access: false, mutation: consumed_gate_only}
  - {id: single_read_only_run, provider_access: read_only, retry_allowed: false}
  - {id: diagnostic_result, provider_access: false, authorizes: fix_plan_only}
authorization:
  approval_mode: OWNER_SOLO_APPROVAL
  four_eyes_satisfied: false
  account_and_principal_are_distinct_bindings: true
  same_principal_accounts_extend_provider_permission: false
  cited_two_person_duty_single_principal_status: BLOCKED_SINGLE_PRINCIPAL
  required_before_port_factory: true
  required_before_every_read: true
  credential_write_guard_required: true
  persistent_one_shot_marker_required: true
  crash_does_not_restore_run_permission: true
client_receipt:
  browser_filename: nac-issue748-client-observation.json
  protected_filename: client-observation-receipt.json
  maximum_bytes: 16384
  canonicalization: utf8-json-sorted-keys-no-whitespace
  exact_fields:
    - end_utc
    - request_correlation_binding_sha256
    - spfx_subject_available
    - start_utc
    - ui_state
    - window_binding_sha256
  ui_state: no_access
  correlation_raw_persisted: false
  correlation_single_use: true
  automatic_download: false
  telemetry: false
  source_read_handle_bound: true
  destination_sid_dacl_protected: true
  destination_create_exclusive: true
  repository_external: true
  stage_network_reads: 0
  stage_login: 0
  stage_credential_writes: 0
  stage_provider_writes: 0
snapshot:
  acquisition_count: 2
  sequences: [1, 2]
  distinct_provider_read_receipts: true
  canonicalization: RFC-8785-closed-integer-subset
  decision_projection_hashes_identical: true
  raw_provider_payload_persisted: false
read_driver_release:
  component_id: nac-issue748-read-driver
  license: AGPL-3.0-or-later
  source_binding_required: true
  classic_sbom_binding_required: true
  http_method_allowlist: [GET]
  resource_allowlist_binding_required: true
  follow_redirects: false
  automatic_retries: 0
  login_allowed: false
  token_refresh_allowed: false
  credential_write_allowed: false
  provider_write_allowed: false
side_effect_counters:
  port_factory: 1
  network_read: classification_specific
  run_gate_consume_write: 1
  result_evidence_write: 1
  login: 0
  device_code: 0
  browser_authentication: 0
  token_refresh: 0
  token_import: 0
  credential_export: 0
  credential_write: 0
  cache_write: 0
  configuration_write: 0
  redirect_follow: 0
  retry: 0
  second_real_run: 0
  tenant_write: 0
  provider_write: 0
  deployment: 0
  issue_739_release: 0
  issue_632_authorization: 0
read_counter_semantics:
  network_read: microsoft_provider_port_reads_only
  github_gate_revalidation: credential_write_guarded_before_every_provider_port_read
counter_matrix:
  repository_implementation_network_read: 0
  client_receipt_stage_network_read: 0
  final_gate_provider_network_read: 0
  windows_preflight_network_read: 0
  SPFX_SUBJECT_MISSING_network_read_per_acquisition: 2
  BFF_REQUEST_NOT_OBSERVED_network_read_per_acquisition: 6
  BFF_AUTHENTICATION_REJECTED_401_network_read_per_acquisition: 6
  BFF_AUTHORIZATION_REJECTED_403_network_read_per_acquisition: 6

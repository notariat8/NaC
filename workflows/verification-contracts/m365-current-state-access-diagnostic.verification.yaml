  account_and_principal_are_distinct_bindings: true
  same_principal_accounts_extend_provider_permission: false
  cited_two_person_duty_single_principal_status: BLOCKED_SINGLE_PRINCIPAL
  required_before_port_factory: true
  required_before_every_read: true
  credential_write_guard_required: true
  persistent_one_shot_marker_required: true
  crash_does_not_restore_run_permission: true
snapshot:
  acquisition_count: 2
  sequences: [1, 2]
  distinct_provider_read_receipts: true
  canonicalization: RFC-8785-closed-integer-subset
  decision_projection_hashes_identical: true
  raw_provider_payload_persisted: false
side_effect_counters:
  port_factory: 1
  network_read: classification_specific
  run_gate_consume_write: 1
  result_evidence_write: 1
  login: 0
  device_code: 0
  browser_authentication: 0
  token_refresh: 0
  token_import: 0
  credential_export: 0
  credential_write: 0
  cache_write: 0
  configuration_write: 0
  redirect_follow: 0
  retry: 0
  second_real_run: 0
  tenant_write: 0
  provider_write: 0
  deployment: 0
  issue_739_release: 0
  issue_632_authorization: 0
counter_matrix:

invariants:
  - The only run states are OFFLINE_READY, LIVE_APPROVED, FAILED_PARTIAL and PASSED.
  - Exactly one consolidated gate supplies owner-approved, the expected activation hash, an immutable Issue #632 approval snapshot authored by exact GitHub login ofunk with GitHub author_association exactly OWNER or MEMBER, the approved commit, the approved tree, all target and permission binding hashes and exactly one toolchain_attestations_sha256 binding; Issue #620 remains parent context only.
  - toolchain_attestations_sha256 is derived only from the exact non-secret azure_cli_toolchain_sha256, m365_cli_sha256, m365_node_sha256, build_python_sha256, build_node_sha256, build_npm_cli_sha256, gh_cli_sha256 and provisioner_certificate_sha256 digests; approval reuse with any changed individual digest or combined hash is forbidden.
  - Final evidence and the host success receipt contain the same toolchain_attestations_sha256 value as the consolidated owner gate; a mismatch blocks PASSED.
  - The offline bff-azure-activation-attestations command derives the eight individual digests, combined hash and live CLI argument map without provider requests or private-key reads; inventing expected values inside live execution is forbidden.
  - The offline bff-azure-activation-owner-gate command checks clean HEAD and tree before and after generation, emits the exact compact owner comment body without trailing newline and its SHA-256, makes zero provider requests, reads no private key and emits no partial approval payload on NOT_READY.
  - provisioner_bootstrap_binding_sha256 is derived from the SHA-256 of state bytes read atomically through one O_NOFOLLOW and size-bounded descriptor plus SHA-256 values of the explicit state, certificate and private-key paths, tenant, provisioner client and Graph v1.0 binding; the raw state and paths remain redacted, and owner payload, generated live CLI arguments, live request and recovery must carry the exact same value.
  - Any supplied but changed provisioner_bootstrap_binding_sha256 fails before the live factory, provider access or tenant write with PROVISIONER_BOOTSTRAP_BINDING_MISMATCH.
  - Owner target, permission and step bindings use sorted compact JSON without a trailing newline; the toolchain combined hash remains separately defined with exactly one trailing newline. Pretty JSON, leading or trailing whitespace and semantically equivalent noncanonical comment bodies are rejected.
  - Immediately before every local Python or Node subprocess, executable bytes are copied from one O_NOFOLLOW/fstat/SHA-256 verified read into sealed Linux memfds; m365_cli_sha256 and build_npm_cli_sha256 bind deterministic full runtime-module-tree manifests, while sealed CommonJS/ESM loaders reject unmanifested, symlinked, native or changed module bytes and compile or evaluate only the exact per-load O_NOFOLLOW/fstat/SHA-256 verified bytes.
  - Azure CLI never executes the original mutable wrapper: its root-owned interpreter, bootstrap and manifest are sealed in memfds, the owner-bound full site-packages tree is copied with per-file O_NOFOLLOW/fstat/SHA-256 verification into a private user/mount namespace and remounted read-only; host Azure configuration is stably copied into a second private tmpfs, custom clouds.config is rejected, an exact bounded host selection containing only [AzureCloud] and the approved subscription is accepted solely as preflight metadata, its stable SHA-256 is sealed into the runtime manifest and revalidated immediately before omission from that private tmpfs, and Azure CLI profile/cache files remain opaque to NaC, but an authenticated Azure CLI account state remains mandatory and installationId-only state fails closed before writes; the private runtime replaces host cloud defaults with an exact AzureCloud config, injects the approved subscription into every command, and before each write a fresh parent-death-pinned child asserts exactly id, tenantId, environmentName and state=Enabled from the same private config snapshot within 30 seconds; duplicate JSON keys fail closed, a close-on-exec pipe is used, inherited non-stdio descriptors are closed before the Azure CLI import, the child runs in a dedicated session whose process group is killed and reaped, stdout/stderr never enter evidence, and timeout, signal or invalid payload terminates and reaps the child before any target write; all extension roots are replaced with one empty read-only private directory, dynamic extension installation is disabled, and unavailable namespace isolation fails before any provider request.
  - Azure deployment consumes only the repository-committed, reproducibly compiled and hash-bound ARM JSON snapshot; runtime Bicep compilation, config-selected Bicep binaries and dynamic Bicep installation are forbidden.
  - SPFx executes direct manifest-allowlisted Heft entrypoints without node_modules/.bin or npm lifecycle shims; the complete post-npm-ci input tree, including native-addon bytes and project configuration, is verified before, between and after build steps. Manifest-bound assets are reverified for synchronous, callback, promise-read, stream and openAsBlob reads through captured verification primordials, captured Set candidate insertion/iteration and immutable own stream listener/push/emit delivery; CommonJS _load, _cache, the extension container, resolver, prototype container, prototype load, require and prototype _compile are pinned, each concrete module receives an immutable own require before execution, and the cache container retains a null prototype before and after delegated loads, pending-to-active-to-completed cache handoff requires matching verified-loader instance provenance, and bare builtins are normalized to canonical node: IDs; .cjs, .json and .node terminals cannot be replaced, and only the manifest-verified pinned Pirates registrar may install a .js transformer that receives immediately verified bytes; verified runtime-asset copies into generated outputs reject symlink destinations and use same-directory temporary files plus atomic rename; application-visible descriptor APIs for protected runtime files fail closed, while only the separately initialized internal ESM loader thread may use its primitive descriptor for the same no-follow, stable-stat and SHA-256 verification. The exact pinned unrs resolver is forced to its WASI implementation, Worker entries receive parent-PID-pinned sealed loaders; fork additionally uses immutable preload-bound executable, manifest, loader and NODE_OPTIONS values, and every public and low-level CommonJS, ESM, ChildProcess-prototype and process-binding spawn, exec and execFile variant plus native-addon execution is rejected. Only declared output directories that were absent from the isolated source copy may be read through stable O_NOFOLLOW/fstat reads; final SPPKG ZIP metadata and the three packager-generated random XML IDs are deterministically normalized, and the final package is SHA-256 bound with two-build reproducibility evidence. Downloaded Teams ZIPs are read once through one stable descriptor, allow only canonical root entries, an exact capability-free manifest field allowlist and validated PNG icons, and bind the SHA-256 of those same validated bytes before publish or update.
  - provisioner_certificate_sha256 binds only the public certificate; private-key content and private-key digests are forbidden in approval and evidence, while the key path must be an owner-only regular non-symlink file.
  - The public certificate digest and the owner-only private-key file boundary are revalidated immediately before every provisioning token fetch; certificate or key drift fails before Graph access.
  - HEAD and HEAD tree equal the approved commit and tree, and git status --porcelain=v1 --untracked-files=all is empty before approval and immediately before the first write.
  - The offline activation plan is recomputed twice from the final clean approved commit and both activation hashes equal the owner-gate expected_activation_sha256.
  - The final recomputation is fsynced to the ledger immediately before the first allowlisted write, with no intervening repository or plan mutation.
  - One exclusive nonblocking host-wide target-global lock covers tenant, subscription and workspace for the entire nonterminal run across all worktrees and clones on the single execution host regardless of output path, activation hash or correlation ID; cross-host coordination is not provided.
  - Each step emits append-only, hash-chained, atomically committed redacted ledger events; completed steps are never blindly replayed.
  - Local hash chains and receipts are tamper-evident against accidental or cross-process mutation but are not cryptographically authentic against an attacker controlling the same OS account; this synthetic MVP makes no formal legal audit claim, which requires a separately approved external immutable or signature lane.
  - Function, SPFx and compiled ARM inputs are read from a trusted Git archive of the exact approved commit/tree, checked against ls-tree modes, blob IDs and per-file SHA-256 digests, with symlinks, gitlinks and traversal rejected; the checkout is never a production build input. Prepared Azure and M365 artifacts are handed only to the attested provider runtime as private, read-only-by-default, filename-preserving expected-SHA-256 snapshots exposed through an inherited directory descriptor, never through their mutable source path; file mode and SHA-256 are verified again after provider return. After exact Entra create-or-reuse readback, the resolved parameter snapshot and full prepared-input manifest, including the approved-tree snapshot digest, are atomically hash-bound before the Bicep write.
  - MVP resume is disabled and no --resume CLI option is exposed; every resume request fails before lock acquisition or provider access until provider-specific read-only reconciliation exists and is independently verified for every write step and crash window.
  - A finalization-integrity failure retains the target-global lock and writes a redacted recovery marker; bff-azure-activation-recovery performs owner-bound local inspection by default and unlocks only with --confirm-unlock, without provider requests, resume, rollback or automatic deletion.
  - Execution stops on the first error; an error after a write yields FAILED_PARTIAL and no later step runs.
  - Automatic rollback, deletion, uninstall, retract, remove and purge operations are forbidden, including after failure.
  - Microsoft Graph access uses raw REST at https://graph.microsoft.com/v1.0 only; Graph beta, SDKs, PnP and legacy SharePoint APIs are forbidden.
  - The owner-gated NaC M365 Provisioning app proves the exact six-role Graph application allowlist in bound local state and live pre-write readback, including exactly one Sites.FullControl.All assignment required for Graph v1.0 site-permission GET and POST; missing, duplicate or broader roles stop before any provider write, and FullControl remains forbidden on the runtime identity.
  - The managed identity has exactly Sites.Selected and no additional Microsoft Graph application role; its exact target-site permission has roles exactly [read] with no duplicate grant.
  - SPFx has no Microsoft Graph permission and requests only NaC M365 BFF/Matter.Read; tenant-wide SPFx activation is forbidden.
  - Tenant, subscription, workspace, site URL and ID, team, all four BFF list IDs, App Catalog solution ProductId, SPFx solution, page, webpart and synthetic matter match exact_bindings.
  - All Entra application/service-principal, managed-identity role, site-grant, App Catalog, SPFx permission/install, page/webpart and synthetic-key duplicate checks plus all broader-permission checks complete read-only before the first provider write.
  - The Azure resource inventory may include only the exact Application Insights Smart Detection companion action group bound to the approved subscription, resource group and canonical ARM ID; one exact argument-bound detail read is bracketed by two identity-list reads that must remain stable. Its Global location, SmartDetect short name, enabled state, two ARM role receivers and zero receivers of every other declared kind are mandatory, while arbitrary action groups, identity changes, adapter failures or property drift stop before the first write.
  - Zero or one exact pre-existing object is handled idempotently where the domain contract permits it; duplicate Entra apps, grants, catalog ProductIds, page webparts or synthetic canonical keys stop the run.
  - Step 11 proves healthz before authentication, successful authenticated reads, fail-closed denied and manipulated requests, verified restoration of the captured assigned synthetic state during normal execution, another authenticated read after restoration and readyz only after that authenticated read; synchronous aborts attempt restoration in finally, but SIGKILL restoration is not claimed and any process termination before verified restoration cannot pass.
  - Unauthorized and manipulated authenticated BFF requests return the same generic 403 ACCESS_DENIED DTO. The M365 process boundary normalizes only the exact allowlisted BFF GET plus the exact CLI 403 status message; raw nonzero stdout, stderr and response bodies are never forwarded.
  - PASSED requires all twelve ordered steps, zero unresolved ambiguity, zero duplicate creation, exact permission readback and valid allowlisted evidence.

thresholds:
  owner_gate_count: 1
  activation_hash_recomputations: 2
  required_steps: 12
  allowed_failed_steps_for_pass: 0
  allowed_skipped_steps_for_pass: 0
  allowed_concurrent_lock_holders: 1
  allowed_graph_application_roles: 1
  allowed_target_site_roles: 1
  allowed_duplicate_exact_resources: 0
  allowed_automatic_rollbacks: 0
  allowed_automatic_deletions: 0
  allowed_unknown_evidence_fields: 0
  allowed_secret_sentinel_matches: 0
  allowed_resume_requests_reaching_lock_or_provider: 0
  required_static_inputs_before_first_write: 3
  required_resolved_inputs_before_bicep_write: 4
  required_summary_fields: 19

negative_tests:
  - id: wrong_hash
    arrange: Pass owner-approved with an expected activation hash differing by one hexadecimal character.
    assert:
      state: OFFLINE_READY
      writes_exact: 0
      stable_error_code: ACTIVATION_HASH_MISMATCH
      later_steps_run: false
  - id: wrong_owner_login
    arrange: Return a valid immutable Issue #632 comment authored by any login other than exact login ofunk.
    assert:
      writes_exact: 0
      stable_error_code: APPROVAL_OWNER_MISMATCH
      lock_acquired: false
  - id: wrong_owner_association
    arrange: Return an immutable Issue #632 comment from exact login ofunk with any missing, malformed or non-allowlisted author_association.
    assert:
      writes_exact: 0
      stable_error_code: APPROVAL_OWNER_MISMATCH
      lock_acquired: false
  - id: toolchain_attestation_tamper
    arrange: Change any one of azure_cli_toolchain_sha256, m365_cli_sha256, m365_node_sha256, build_python_sha256, build_node_sha256, build_npm_cli_sha256, gh_cli_sha256 or provisioner_certificate_sha256, or present a combined toolchain_attestations_sha256 that differs from the immutable approval payload.
    assert:
      provider_read_calls_exact: 0
      provider_write_calls_exact: 0
      writes_exact: 0
      stable_error_codes:
        - TOOLCHAIN_ATTESTATION_INVALID
        - APPROVAL_PAYLOAD_MISMATCH
      approval_reused: false
  - id: dirty_tree
    arrange: Add one tracked modification or one untracked file after approval.
    assert:
      writes_exact: 0
      stable_error_code: GIT_WORKTREE_NOT_CLEAN
      lock_released_after_terminal_ledger_event: true
  - id: wrong_target
    arrange: Substitute any tenant, subscription, workspace, site URL or ID, team, list ID, App Catalog ProductId, page, webpart or matter binding.
    assert:
      writes_exact: 0
      stable_error_code: TARGET_BINDING_MISMATCH
      provider_write_adapter_called: false
  - id: duplicates
    arrange: Return two matching Entra apps or API service principals, managed-identity service principals or role assignments, site grants, App Catalog ProductIds, SPFx permission requests or installs, page webparts, or canonical synthetic rows during the full read-only prewrite inventory.
    assert:
      writes_exact: 0
      stable_error_codes:
        - API_APPLICATION_DUPLICATE
        - API_SERVICE_PRINCIPAL_DUPLICATE
        - UAMI_SERVICE_PRINCIPAL_DUPLICATE
        - GRAPH_ROLE_ASSIGNMENT_DUPLICATE
        - SITE_PERMISSION_DUPLICATE
        - AZURE_RESOURCE_INVENTORY_DUPLICATE
        - TEAMS_CATALOG_APP_DUPLICATE
        - TEAMS_INSTALLATION_DUPLICATE
        - SPFX_BFF_PERMISSION_STATE_DUPLICATE
        - SPFX_TARGET_PAGE_DUPLICATE
        - SPFX_PAGE_WEBPART_DUPLICATE
        - SYNTHETIC_DUPLICATE_BLOCKED
      automatic_deletions_exact: 0
  - id: azure_smart_detection_companion_drift
    arrange: Return an arbitrary Action Group, a foreign or malformed ARM identity, an adapter exception, a failed or malformed exact read result, inventory identity drift between the two list reads, or a changed Global/SmartDetect/enabled/receiver fingerprint of the Application Insights Smart Detection companion.
    assert:
      writes_exact: 0
      later_steps_run: false
      stable_error_codes:
        - AZURE_RESOURCE_INVENTORY_UNEXPECTED
        - AZURE_RESOURCE_PROPERTY_DRIFT
        - AZURE_SMART_DETECTION_READBACK_FAILED
        - AZURE_RESOURCE_INVENTORY_CHANGED_DURING_READBACK
  - id: broader_permissions
    arrange: Return a managed-identity Graph role in addition to Sites.Selected, a target-site role other than read, an SPFx Graph permission or an extra delegated scope.
    assert:
      writes_exact: 0
      stable_error_codes:
        - GRAPH_ROLE_ASSIGNMENT_BROADER
        - SITE_PERMISSION_BROADER
        - SPFX_BFF_GRANT_BROADER_OR_DUPLICATE
        - SPFX_BFF_PERMISSION_REQUEST_UNEXPECTED
      automatic_permission_downgrade_attempted: false
  - id: race
    arrange: Start two runners against the same tenant, subscription and workspace with different output paths, activation hashes or correlation IDs while the first holds the target-global lock.
    assert:
      successful_lock_holders_exact: 1
      second_runner_writes_exact: 0
      second_runner_error_code: ACTIVATION_LOCK_HELD
      stale_lock_auto_break_attempted: false
  - id: secret_sentinel
    arrange: Inject NAC_SECRET_SENTINEL_632 into environment values, provider stdout and provider stderr for both success and failure paths.
    assert:
      sentinel_matches_in_ledger_exact: 0
      sentinel_matches_in_evidence_exact: 0
      stable_error_code: SENSITIVE_VALUE_REJECTED
      raw_stdout_or_stderr_fields_exact: 0
      evidence_validation_result: REJECT_ON_ANY_MATCH
  - id: prepared_input_drift
    arrange: Change one byte in a static Function/SPFx/Bicep snapshot after prewrite binding, or in the resolved Bicep parameter snapshot/full manifest after exact Entra readback and before the Bicep write.
    assert:
      writes_exact: 0
      stable_error_codes:
        - STATIC_PREPARED_INPUTS_MISMATCH
        - PREPARED_ARTIFACT_HASH_MISMATCH
        - PREPARED_INPUTS_MANIFEST_MISMATCH
        - AZURE_DEPLOYMENT_INPUT_DRIFT
      package_rebuild_attempted: false
  - id: health_auth_ready_order
    arrange: Make readyz run before a successful authenticated read or make healthz run after the first authentication attempt.
    assert:
      state: FAILED_PARTIAL
      later_steps_run: false
      ordered_probe_sequence_exact:
        - assigned
        - deputy
        - denied
        - tampered
        - restore_assigned
        - final_assigned_read
        - readyz
  - id: synthetic_restoration_failure
    arrange: Mutate the bounded synthetic access state for a deputy or deny check and fail deterministic restoration to the captured assigned baseline.
    assert:
      state: FAILED_PARTIAL
      readyz_called: false
      later_steps_run: false
      stable_error_code: SYNTHETIC_STATE_RESTORATION_FAILED
  - id: first_error_after_write
    arrange: Make one write succeed, atomically record it, then fail the next step.
    assert:
      state: FAILED_PARTIAL
      later_steps_run: false
      automatic_rollbacks_exact: 0
      automatic_deletions_exact: 0
  - id: arm_deployment_timeout_reconciliation
    arrange: Make the exact hash-bound ARM deployment outlive the local Azure CLI timeout, then return terminal Succeeded, Failed, Canceled, stale, missing, malformed and non-terminal provider readbacks.
    assert:
      state: FAILED_PARTIAL
      later_steps_run: false
      deployment_create_calls_exact: 1
      reconciliation_write_calls_exact: 0
      automatic_rollbacks_exact: 0
      automatic_deletions_exact: 0
      stable_error_codes:
        - AZURE_BASELINE_DEPLOYMENT_SUCCEEDED_REQUIRES_NEW_RUN
        - AZURE_BASELINE_DEPLOYMENT_FAILED
        - AZURE_BASELINE_DEPLOYMENT_CANCELED
        - AZURE_DEPLOYMENT_STATE_AMBIGUOUS
      unresolved_target_lock_retained: true
      cross_version_legacy_lock_namespace_held: true
      legacy_host_lock_namespace_held: true
      readback_failures_map_to_ambiguous: true
      legacy_lock_hash_ledger_bound: true
      reconciled_template_hash_exact: true
      failed_baseline_missing_entra_rejected: true
      failed_baseline_entra_and_parameters_exact: true
      arm_value_only_wrapper_accepted: true
      arm_type_and_value_wrapper_accepted: true
      arm_parameter_types_exact: true
      arm_parameter_value_types_exact: true
      arm_unknown_wrapper_fields_rejected: true
      canonical_parameter_comparison_value_only: true
      canonical_parameter_hash_value_only: true
      failed_baseline_template_hash_owner_bound: true
  - id: function_deployment_timeout_quarantine
    arrange: Make the exact hash-bound Function config-zip invocation time out or return any shape other than the exact pinned CLI success string.
    assert:
      state: FAILED_PARTIAL
      later_steps_run: false
      stable_error_code: AZURE_FUNCTION_DEPLOYMENT_STATE_AMBIGUOUS
      cli_success_payload_exact: Deployment was successful.
      health_readback_calls_exact: 0
      unresolved_target_lock_retained: true
      cross_version_legacy_lock_namespace_held: true
      legacy_host_lock_namespace_held: true
      automatic_rollbacks_exact: 0
      automatic_deletions_exact: 0
  - id: lock_journal_torn_release
    arrange: Tear the append of a RELEASED JSON-lines record once at each primary, legacy and legacy-host marker after committed state and receipt exist.
    assert:
      release_positions_exact:
        - primary
        - legacy
        - legacy_host
      state: FAILED_PARTIAL
      stable_error_code: FINALIZATION_LOCK_RELEASE_FAILED
      committed_state_and_success_receipt_retained: true
      recovery_marker_retained: true
      confirmed_recovery_result: FINALIZATION_LOCK_RECONCILED
  - id: lock_recovery_retry_after_torn_release
    arrange: Authorize recovery, tear the second RELEASED journal append, then retry the same owner-bound confirm-unlock request.
    assert:
      first_recovery_error_code: FINALIZATION_LOCK_RELEASE_FAILED
      reconcile_marker_retained: true
      second_recovery_result: FINALIZATION_LOCK_RECONCILED
      all_three_markers_released: true
  - id: invalid_existing_lock_journal
    arrange: Precreate an owner-only regular lock file that is empty, malformed, noncanonical, or has an invalid marker state.
    assert:
      acquisition_succeeds: false
      existing_bytes_changed: false
      provider_read_calls_exact: 0
      provider_write_calls_exact: 0
  - id: recovery_marker_completeness
    arrange: Remove any one of the primary, legacy or legacy-host markers, or remove a required host-state directory, before read-only recovery.
    assert:
      all_three_markers_required: true
      missing_directories_created: false
      provider_read_calls_exact: 0
      provider_write_calls_exact: 0
  - id: provisioner_bootstrap_source_drift
    arrange: Change one byte in either provisioner bootstrap source after the activation plan was hash-bound.
    assert:
      source_paths_exact:
        - src/nac_bff/azure_activation_provisioner_bootstrap.py
        - src/nac_m365_graph/provisioner_env_bootstrap.py
      activation_hash_changes_for_each_source: true
      provider_write_calls_exact: 0
  - id: legacy_newline_lock_recovery
    arrange: Replace all three HELD lock markers of a valid recoverable run with the canonical legacy single activation-hash object including its trailing newline.
    assert:
      legacy_marker_shape_exact: canonical_single_activation_hash_object_with_trailing_newline
      unattended_reacquisition_allowed: false
      confirmed_recovery_result: FINALIZATION_LOCK_RECONCILED
      all_three_markers_released: true
  - id: terminal_failed_partial_torn_release
    arrange: Persist a non-ambiguous terminal FAILED_PARTIAL state and evidence, then tear one of the three RELEASED journal appends.
    assert:
      state: FAILED_PARTIAL
      stable_error_code: TERMINAL_LOCK_RELEASE_RECOVERY_REQUIRED
      recovery_marker_status_exact: TERMINAL_RELEASE_IN_PROGRESS
      ambiguous_provider_state_allowed: false
      confirmed_recovery_result: FINALIZATION_LOCK_RECONCILED
      all_three_markers_released: true
  - id: resume_disabled
    arrange: Supply --resume or set resume true before provider-specific read-only reconcilers exist for every write step and crash window.
    assert:
      state: OFFLINE_READY
      lock_acquired: false
      provider_read_calls_exact: 0
      provider_write_calls_exact: 0
      stable_error_code: RESUME_DISABLED_FOR_MVP

required_evidence:
  - Redacted provisioner-bootstrap readiness proving trusted explicit state/certificate/key metadata, exact tenant/application binding, certificate-only Graph v1.0 mode, zero private-key content reads, zero provider requests and zero tenant writes; IDs, paths and credential values remain omitted.
  - Immutable Issue #632 owner approval snapshot metadata for exact login ofunk and body SHA-256, stored only as a reference hash in the final artifact; Issue #620 remains parent context.
  - Approved commit and tree plus two matching activation-hash recomputations.
  - Exact target-binding and permission-boundary SHA-256 values.
  - The owner-bound toolchain_attestations_sha256 derived from exactly eight non-secret execution digests, repeated unchanged in final evidence and the host success receipt.
  - Target-global lock acquisition and release events proving output-path, activation-hash and correlation-ID independence without host secrets or process environment.
  - Prepared-input manifest hashes for the Function package, site-scoped SPFx package, Bicep template snapshot and resolved Bicep parameter snapshot.
  - Hash-chained per-step ledger head and exactly twelve terminal PASSED step records for PASSED.
  - Redacted readback proving exactly Sites.Selected, exact target-site read, exact BFF Matter.Read and zero broader permissions.
  - Redacted read-only convergence summary proving causal deployment-input binding, zero duplicate readback and no automatic rollback or deletion; replaying provider writes is not claimed.
  - Redacted ordered probe and restoration summary proving healthz before auth, authenticated read before readyz and verified restoration to assigned synthetic state; incomplete/crashed runs remain non-success and require read-only reconciliation plus manual recovery.
  - Negative-test output for wrong hash, wrong owner login, toolchain_attestation_tamper, dirty tree, wrong target, duplicates, azure_smart_detection_companion_drift, broader permissions, target-global lock race, prepared-input drift, probe order, synthetic restoration, secret sentinel, partial failure, torn lock-journal release at all three marker positions, retryable recovery release, invalid or incomplete lock-marker sets, provisioner-bootstrap source drift, canonical legacy-newline lock recovery, terminal FAILED_PARTIAL torn-release recovery and disabled resume.

host_success_receipt:
  required_for_passed: true
  toolchain_attestations_sha256_must_equal_owner_gate_and_evidence: true
  fields_exact:
    - schema_version
    - status
    - activation_hash
    - approval_body_sha256
    - approval_reference_sha256
    - approved_commit_sha
    - approved_tree_sha
    - provisioner_bootstrap_binding_sha256
    - toolchain_attestations_sha256
    - target_binding_sha256
    - evidence_sha256
    - final_commit_marker_sha256
    - final_state_sha256
    - receipt_sha256

evidence_policy:
  local_trust_boundary:
    tamper_evident_against_accidental_or_cross_process_mutation: true
    cryptographically_authentic_against_same_os_account: false
    formal_legal_audit_claimed: false
    formal_audit_requires: external_immutable_or_signature_lane
    formal_audit_lane_status: DEFERRED_OUTSIDE_SYNTHETIC_MVP
  top_level_allowlist_exact:
    - schema_version
    - status
    - started_at_utc
    - finished_at_utc
    - activation_hash
    - approved_commit_sha
    - approved_tree_sha
    - approval_reference_sha256
    - provisioner_bootstrap_binding_sha256
    - toolchain_attestations_sha256
    - target_binding_sha256
    - permission_boundary_sha256
    - ledger_head_sha256
    - step_results
    - summary
  step_field_allowlist_exact:
    - order
    - id
    - status
    - attempt
    - classification
    - http_status
    - stable_error_code
    - request_sha256
    - response_sha256
    - resource_reference_sha256
  summary_field_allowlist_exact:
    - required_step_count
    - passed_step_count
    - failed_step_count
    - duplicate_count
    - broader_permission_count
    - automatic_rollback_count
    - automatic_deletion_count
    - writes_started
    - ledger_hash_chain_valid
    - prebuilt_inputs_verified
    - healthz_before_auth_passed
    - authenticated_read_passed
    - readyz_after_authenticated_read_passed
    - synthetic_state_restored
    - assigned_access_passed
    - deputy_access_passed
    - denied_access_passed
    - tampered_access_passed
    - resume_enabled
  redacted_only: true
  strict_unknown_field_rejection: true
  raw_ids_urls_paths_commands_payloads_or_provider_responses_allowed: false
  stdout_stderr_headers_tokens_cookies_environment_or_credentials_allowed: false
  people_mandate_document_or_production_data_allowed: false

pass_condition:
  final_state: PASSED
  all_checks_pass: true
  owner_gate_count_exact: 1
  approved_clean_commit_and_tree_match: true
  both_activation_hash_recomputations_match: true
  all_exact_targets_match: true
  all_twelve_steps_pass_once: true
  permissions_exactly_sites_selected_and_site_read: true
  duplicate_count_exact: 0
  automatic_rollback_count_exact: 0
  automatic_deletion_count_exact: 0
  ledger_hash_chain_valid: true
  prebuilt_inputs_verified: true
  provisioner_bootstrap_readiness_passed_before_live_factory: true
  toolchain_attestations_match_owner_gate_and_host_success_receipt: true
  healthz_before_auth_passed: true
  authenticated_read_passed: true
  readyz_after_authenticated_read_passed: true
  synthetic_state_restored: true
  assigned_access_passed: true
  deputy_access_passed: true
  denied_access_passed: true
  tampered_access_passed: true
  resume_enabled: false
  evidence_allowlist_valid: true
  write_replay_idempotency_claimed: false
  secret_sentinel_matches_exact: 0

failure_behavior:
  provisioner_bootstrap_failure: stop_before_live_factory_provider_access_or_tenant_write_with_stable_PROVISIONER_error
  owner_gate_hash_git_target_permission_duplicate_or_lock_failure: stop_before_first_write
  first_error_after_any_write: set_FAILED_PARTIAL_append_redacted_terminal_event_and_stop
  resume_request: reject_before_lock_or_provider_access_with_RESUME_DISABLED_FOR_MVP
  finalization_integrity_failure: retain_lock_and_require_owner_bound_local_reconcile
  ledger_corruption_or_provider_ambiguity: remain_FAILED_PARTIAL_and_require_human_review
  evidence_unknown_field_or_secret_sentinel: reject_evidence_and_block_PASSED
  binding_change_including_any_toolchain_digest: require_new_consolidated_owner_gate
  automatic_rollback_or_deletion: forbidden

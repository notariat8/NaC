name: NaC Windows Portability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-offline-cli:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Configure private Windows test workspace
        shell: pwsh
        run: |
          $currentIdentity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          function Set-PrivateAcl {
            param(
              [Parameter(Mandatory = $true)][string]$LiteralPath,
              [Parameter(Mandatory = $true)][bool]$Directory
            )
            $security = if ($Directory) {
              [System.Security.AccessControl.DirectorySecurity]::new()
            } else {
              [System.Security.AccessControl.FileSecurity]::new()
            }
            $security.SetOwner($currentIdentity.User)
            $security.SetAccessRuleProtection($true, $false)
            $inheritance = if ($Directory) {
              [System.Security.AccessControl.InheritanceFlags]::ContainerInherit -bor [System.Security.AccessControl.InheritanceFlags]::ObjectInherit
            } else {
              [System.Security.AccessControl.InheritanceFlags]::None
            }
            foreach ($sidValue in @($currentIdentity.User.Value, "S-1-5-18", "S-1-5-32-544")) {
              $sid = [System.Security.Principal.SecurityIdentifier]::new($sidValue)
              $rule = [System.Security.AccessControl.FileSystemAccessRule]::new(
                $sid,
                [System.Security.AccessControl.FileSystemRights]::FullControl,
                $inheritance,
                [System.Security.AccessControl.PropagationFlags]::None,
                [System.Security.AccessControl.AccessControlType]::Allow
              )
              $security.AddAccessRule($rule) | Out-Null
            }
            Set-Acl -LiteralPath $LiteralPath -AclObject $security
          }
          $workspaceEntries = Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force -Recurse | Sort-Object { $_.FullName.Length } -Descending
          foreach ($entry in $workspaceEntries) {
            Set-PrivateAcl -LiteralPath $entry.FullName -Directory $entry.PSIsContainer
          }
          Set-PrivateAcl -LiteralPath $env:GITHUB_WORKSPACE -Directory $true
          $privateRoot = Join-Path $env:RUNNER_TEMP "nac-private-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $privateRoot -Force | Out-Null
          Set-PrivateAcl -LiteralPath $privateRoot -Directory $true
          $sitecustomize = @'
          import ctypes
          import os
          from ctypes import wintypes

          if os.name == "nt":
              TOKEN_ADJUST_DEFAULT = 0x0080
              TOKEN_QUERY = 0x0008
              TOKEN_USER_CLASS = 1
              TOKEN_OWNER_CLASS = 4
              TOKEN_DEFAULT_DACL_CLASS = 6
              SE_FILE_OBJECT = 1
              DACL_SECURITY_INFORMATION = 0x00000004

              class SID_AND_ATTRIBUTES(ctypes.Structure):
                  _fields_ = [("Sid", ctypes.c_void_p), ("Attributes", wintypes.DWORD)]

              class TOKEN_USER(ctypes.Structure):
                  _fields_ = [("User", SID_AND_ATTRIBUTES)]

              class TOKEN_OWNER(ctypes.Structure):
                  _fields_ = [("Owner", ctypes.c_void_p)]

              class TOKEN_DEFAULT_DACL(ctypes.Structure):
                  _fields_ = [("DefaultDacl", ctypes.c_void_p)]

              advapi32 = ctypes.WinDLL("advapi32", use_last_error=True)
              kernel32 = ctypes.WinDLL("kernel32", use_last_error=True)
              kernel32.GetCurrentProcess.argtypes = []
              kernel32.GetCurrentProcess.restype = wintypes.HANDLE
              kernel32.CloseHandle.argtypes = [wintypes.HANDLE]
              kernel32.CloseHandle.restype = wintypes.BOOL
              kernel32.LocalFree.argtypes = [ctypes.c_void_p]
              kernel32.LocalFree.restype = ctypes.c_void_p
              advapi32.OpenProcessToken.argtypes = [
                  wintypes.HANDLE,
                  wintypes.DWORD,
                  ctypes.POINTER(wintypes.HANDLE),
              ]
              advapi32.OpenProcessToken.restype = wintypes.BOOL
              advapi32.GetTokenInformation.argtypes = [
                  wintypes.HANDLE,
                  ctypes.c_uint,
                  ctypes.c_void_p,
                  wintypes.DWORD,
                  ctypes.POINTER(wintypes.DWORD),
              ]
              advapi32.GetTokenInformation.restype = wintypes.BOOL
              advapi32.SetTokenInformation.argtypes = [
                  wintypes.HANDLE,
                  ctypes.c_uint,
                  ctypes.c_void_p,
                  wintypes.DWORD,
              ]
              advapi32.SetTokenInformation.restype = wintypes.BOOL
              advapi32.GetNamedSecurityInfoW.argtypes = [
                  wintypes.LPWSTR,
                  ctypes.c_uint,
                  wintypes.DWORD,
                  ctypes.c_void_p,
                  ctypes.c_void_p,
                  ctypes.POINTER(ctypes.c_void_p),
                  ctypes.c_void_p,
                  ctypes.POINTER(ctypes.c_void_p),
              ]
              advapi32.GetNamedSecurityInfoW.restype = wintypes.DWORD
              token = wintypes.HANDLE()
              if not advapi32.OpenProcessToken(
                  kernel32.GetCurrentProcess(),
                  TOKEN_ADJUST_DEFAULT | TOKEN_QUERY,
                  ctypes.byref(token),
              ):
                  raise SystemExit("WINDOWS_TEST_TOKEN_OPEN_FAILED")
              try:
                  required = wintypes.DWORD()
                  advapi32.GetTokenInformation(
                      token, TOKEN_USER_CLASS, None, 0, ctypes.byref(required)
                  )
                  if not required.value:
                      raise SystemExit("WINDOWS_TEST_TOKEN_USER_FAILED")
                  buffer = ctypes.create_string_buffer(required.value)
                  if not advapi32.GetTokenInformation(
                      token,
                      TOKEN_USER_CLASS,
                      buffer,
                      required.value,
                      ctypes.byref(required),
                  ):
                      raise SystemExit("WINDOWS_TEST_TOKEN_USER_FAILED")
                  user = ctypes.cast(buffer, ctypes.POINTER(TOKEN_USER)).contents
                  owner = TOKEN_OWNER(user.User.Sid)
                  if not advapi32.SetTokenInformation(
                      token,
                      TOKEN_OWNER_CLASS,
                      ctypes.byref(owner),
                      ctypes.sizeof(owner),
                  ):
                      raise SystemExit("WINDOWS_TEST_TOKEN_OWNER_FAILED")
                  dacl = ctypes.c_void_p()
                  descriptor = ctypes.c_void_p()
                  status = advapi32.GetNamedSecurityInfoW(
                      os.environ["TEMP"],
                      SE_FILE_OBJECT,
                      DACL_SECURITY_INFORMATION,
                      None,
                      None,
                      ctypes.byref(dacl),
                      None,
                      ctypes.byref(descriptor),
                  )
                  if status != 0 or not dacl.value:
                      raise SystemExit("WINDOWS_TEST_DACL_READ_FAILED")
                  try:
                      default_dacl = TOKEN_DEFAULT_DACL(dacl)
                      if not advapi32.SetTokenInformation(
                          token,
                          TOKEN_DEFAULT_DACL_CLASS,
                          ctypes.byref(default_dacl),
                          ctypes.sizeof(default_dacl),
                      ):
                          raise SystemExit("WINDOWS_TEST_TOKEN_DACL_FAILED")
                  finally:
                      kernel32.LocalFree(descriptor)
              finally:
                  kernel32.CloseHandle(token)
          '@
          Set-Content -LiteralPath (Join-Path $privateRoot "sitecustomize.py") -Value $sitecustomize -Encoding utf8
          "TEMP=$privateRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$privateRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPATH=$privateRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install NaC
        run: python -m pip install --disable-pip-version-check -e .

      - name: Install Graft context layer CLI
        run: npm install -g @nanonets/graft

      - name: Verify native Windows activation security and portability
        shell: pwsh
        run: |
          $testOutput = & python -m unittest discover -s tests -p "test_activation_security*.py" 2>&1
          $testExitCode = $LASTEXITCODE
          $testOutput | ForEach-Object { Write-Output $_ }
          if ($testExitCode -ne 0) {
            $diagnostic = ($testOutput | Select-Object -Last 80) -join "`n"
            $diagnostic = $diagnostic.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows portability tests failed::$diagnostic"
            exit $testExitCode
          }

      - name: Verify portable CLI, SPFx readback, and Issue 746 contract
        run: |
          python -m unittest discover -s tests -p "test_windows_offline_cli_portability.py"
          python -m unittest discover -s tests -p "test_spfx_bff_catalog_readback_regression.py"
          python -m unittest discover -s tests -p "test_m365_bff_failed_partial_safe_completion.py"
          python -m unittest discover -s tests -p "test_issue746_reconciliation_gate.py"
          python -m unittest discover -s tests -p "test_nac_bff_azure_activation_cli.py"

      - name: Verify Issue 746 and activation contracts
        run: |
          python scripts/validate_m365_bff_failed_partial_safe_completion.py
          python scripts/validate_m365_azure_bff_live_activation.py
          python scripts/validate_spec_traceability.py

      - name: Verify the complete Issue 746 Windows matrix
        run: |
          python scripts/validate_ai_sbom.py
          python -m unittest discover -s tests -p "test_nac_bff_azure_*.py"
          python -m unittest discover -s tests -p "test_business_case_type_*.py"
          python -m unittest discover -s tests -p "test_m365_*.py"
          python -m unittest discover -s tests -p "test_sqlite_evidence_staging_outbox.py"
          graft build
          graft check
          python scripts/nac.py doctor --profile strict

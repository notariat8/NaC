name: Governance Policy Sync

on:
  pull_request:
    paths:
      - "policies/**/*.yaml"
      - "policies/**/*.json"
      - "AGENTS.md"
      - ".codex/agents/**"
      - "scripts/validate_governance_sync.py"
      - "scripts/validate_identity_registry.py"
      - "tests/test_identity_registry.py"
  workflow_dispatch:

jobs:
  validate-governance-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate governance policy sync
        run: python scripts/validate_governance_sync.py

      - name: Validate account and principal identity registry
        run: python -m unittest tests.test_identity_registry

name: Validate NaC Runtime Fixtures

on:
  pull_request:
    paths:
      - "processes/**/*.json"
      - "schemas/**/*.json"
      - "src/business_os/**/*.py"
      - "src/nac_runtime/**/*.py"
      - "src/nac_web/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Validate all process documents
        run: python scripts/nac.py process validate-all

      - name: Run tests
        shell: bash
        run: |
          log_file="$(mktemp)"
          if python -m unittest discover -s tests -p "test_*.py" >"$log_file" 2>&1; then
            cat "$log_file"
          else
            failures="$(grep -E '^(FAIL|ERROR): test_[A-Za-z0-9_]+ \([A-Za-z0-9_.]+\)' "$log_file" | sed -E 's/^(FAIL|ERROR): ([A-Za-z0-9_]+) \(([A-Za-z0-9_.]+)\).*$/\1:\3.\2/' | sort -u | paste -sd, -)"
            if [ -z "$failures" ]; then
              failures="UNCLASSIFIED_UNITTEST_FAILURE"
            fi
            failed_validators="$(grep -Eo 'CONTRACT_VALIDATOR_FAILED:validate_[a-z0-9_]+' "$log_file" | cut -d: -f2 | sort -u | paste -sd, -)"
            if [ -z "$failed_validators" ]; then
              failed_validators="UNCLASSIFIED_CONTRACT_VALIDATOR_FAILURE"
            fi
            failed_behaviors="$(grep -Eo 'BEHAVIOR_TEST_FAILED:[A-Za-z0-9_.]+' "$log_file" | cut -d: -f2 | sort -u | paste -sd, -)"
            if [ -z "$failed_behaviors" ]; then
              failed_behaviors="NO_CANONICAL_BEHAVIOR_FAILURE"
            fi
            echo "::error title=Linux runtime fixture tests failed::failed_tests=$failures failed_validators=$failed_validators failed_behaviors=$failed_behaviors"
            exit 1
          fi

      - name: Render fixture summaries
        shell: bash
        run: |
          python scripts/nac.py process render-summary processes/invoices/2026/REQ-2026-0001.json
          python scripts/nac.py process render-summary processes/bookkeeping/2026/REQ-2026-0002.json

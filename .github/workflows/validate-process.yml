name: Validate NaC Runtime Fixtures

on:
  pull_request:
    paths:
      - "processes/**/*.json"
      - "schemas/**/*.json"
      - "src/business_os/**/*.py"
      - "src/nac_runtime/**/*.py"
      - "src/nac_web/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Validate all process documents
        run: python scripts/nac.py process validate-all

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Render fixture summaries
        shell: bash
        run: |
          python scripts/nac.py process render-summary processes/invoices/2026/REQ-2026-0001.json
          python scripts/nac.py process render-summary processes/bookkeeping/2026/REQ-2026-0002.json

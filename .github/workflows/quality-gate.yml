name: NaC Quality Gate

on:
  push:
    paths:
      - "processes/**/*.json"
      - "schemas/**/*.json"
      - "src/business_os/**/*.py"
      - "tests/**/*.py"
      - "scripts/**/*.py"
      - "policies/**/*.yaml"
      - "policies/**/*.json"
      - "docs/**/*.md"
      - "**/*.adoc"
      - "**/*.asciidoc"
      - "prompts/**/*.md"
      - "deploy/**"
      - "plugins/**"
      - "workflows/**"
      - "usecases/**"
      - "roadmap/**"
      - "spfx/**"
      - ".codex/agents/**"
      - ".github/workflows/*.yml"
      - "AGENTS.md"
      - "README.md"
      - "pyproject.toml"
  pull_request:
    paths:
      - "processes/**/*.json"
      - "schemas/**/*.json"
      - "src/business_os/**/*.py"
      - "tests/**/*.py"
      - "scripts/**/*.py"
      - "policies/**/*.yaml"
      - "policies/**/*.json"
      - "docs/**/*.md"
      - "**/*.adoc"
      - "**/*.asciidoc"
      - "prompts/**/*.md"
      - "deploy/**"
      - "plugins/**"
      - "workflows/**"
      - "usecases/**"
      - "roadmap/**"
      - "spfx/**"
      - ".codex/agents/**"
      - ".github/workflows/*.yml"
      - "AGENTS.md"
      - "README.md"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  spfx-bpmn-viewer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: spfx/nac-bpmn-viewer/package-lock.json

      - name: Install pinned SPFx dependencies
        working-directory: spfx/nac-bpmn-viewer
        run: npm ci --ignore-scripts

      - name: Test, build and package BPMN viewer
        working-directory: spfx/nac-bpmn-viewer
        run: npm run build

      - name: Upload generic workbench compiled evidence
        uses: actions/upload-artifact@v7
        with:
          name: generic-workbench-compiled
          if-no-files-found: error
          path: |
            spfx/nac-bpmn-viewer/lib-commonjs/workbench/core/WorkbenchContracts.js
            spfx/nac-bpmn-viewer/lib-commonjs/workbench/core/WorkbenchSelectors.js
            spfx/nac-bpmn-viewer/lib-commonjs/workbench/core/parseWorkbenchSnapshot.js
            spfx/nac-bpmn-viewer/lib-commonjs/workbench/nac/NacWorkbenchProjection.js
            spfx/nac-bpmn-viewer/lib-commonjs/workbench/react/WorkbenchPanel.js
            spfx/nac-bpmn-viewer/lib-commonjs/workbench/react/WorkbenchPanel.styles.js

  quality-gate:
    needs: spfx-bpmn-viewer
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Require successful SPFx evidence build
        env:
          SPFX_EVIDENCE_RESULT: ${{ needs.spfx-bpmn-viewer.result }}
        run: |
          if [ "$SPFX_EVIDENCE_RESULT" != "success" ]; then
            echo "SPFx evidence build did not complete successfully: $SPFX_EVIDENCE_RESULT" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Download generic workbench compiled evidence
        uses: actions/download-artifact@v7
        with:
          name: generic-workbench-compiled
          path: spfx/nac-bpmn-viewer/lib-commonjs/workbench

      - name: Install pinned Bicep compiler
        run: az bicep install --version v0.45.6

      - name: Reproduce Azure BFF Bicep artifacts
        run: |
          az bicep build --file deploy/runtime/azure/nac-bff/infra/main.bicep --stdout > /tmp/nac-bff-main.json
          az bicep build-params --file deploy/runtime/azure/nac-bff/infra/main.example.bicepparam --stdout > /tmp/nac-bff-main-params.json
          cmp /tmp/nac-bff-main.json deploy/runtime/azure/nac-bff/infra/compiled/main.json
          cmp /tmp/nac-bff-main-params.json deploy/runtime/azure/nac-bff/infra/compiled/main.example.json

      - name: Compile Azure WORM Bicep baseline
        run: az bicep build --file deploy/runtime/azure/immutable-evidence/main.bicep --stdout > /tmp/nac-worm-main.json

      - name: Run strict quality gate
        env:
          NAC_REQUIRE_WORKBENCH_BUILD_EVIDENCE: "1"
        run: python scripts/quality_gate.py --profile strict

      - name: Render PR developer CI comment
        if: always() && github.event_name == 'pull_request'
        run: python scripts/render_quality_gate_comment.py --input out/quality/status.json --output out/quality/comment.md

      - name: Upsert PR developer CI comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- nac-quality-gate-comment -->';
            const body = fs.readFileSync('out/quality/comment.md', 'utf8');
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                per_page: 100,
              }
            );
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated quality gate comment ${existing.id}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
              core.info(`Created quality gate comment ${created.data.id}`);
            }

      - name: Upload quality gate artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nac-quality-gate
          path: out/quality/

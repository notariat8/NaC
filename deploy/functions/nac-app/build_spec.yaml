version: 0.1
component: build
timeoutInSeconds: 3600
shell: bash
failImmediatelyOnError: true

env:
  exportedVariables:
    - BUILDRUN_HASH

steps:
  - type: Command
    name: "Prepare immutable image tag"
    timeoutInSeconds: 120
    command: |
      BUILDRUN_HASH="${OCI_PRIMARY_SOURCE_COMMIT_HASH:-${OCI_BUILD_RUN_ID}}"
      BUILDRUN_HASH="$(printf '%s' "$BUILDRUN_HASH" | cut -c 1-12)"
      export BUILDRUN_HASH
      echo "Building notariat8 NaC OCI Functions image ${BUILDRUN_HASH}"

  - type: Command
    name: "Run Functions adapter tests"
    timeoutInSeconds: 600
    command: |
      resolve_nac_source_dir() {
        for candidate in "${OCI_PRIMARY_SOURCE_DIR:-}" nac .; do
          test -n "$candidate" || continue
          if test -d "$candidate/tests" && test -f "$candidate/deploy/functions/nac-app/Dockerfile"; then
            printf '%s\n' "$candidate"
            return 0
          fi
        done
        echo "Unable to locate NaC source checkout" >&2
        find . -maxdepth 2 -type d -name tests -print >&2 || true
        return 1
      }
      NAC_SOURCE_DIR="$(resolve_nac_source_dir)"
      echo "Using NaC source directory: $NAC_SOURCE_DIR"
      cd "$NAC_SOURCE_DIR"
      test -f tests/test_oci_functions_adapter.py
      python3 -m unittest discover -s tests -p 'test_oci_functions_adapter.py' -v

  - type: Command
    name: "Build Functions image"
    timeoutInSeconds: 1800
    command: |
      resolve_nac_source_dir() {
        for candidate in "${OCI_PRIMARY_SOURCE_DIR:-}" nac .; do
          test -n "$candidate" || continue
          if test -d "$candidate/tests" && test -f "$candidate/deploy/functions/nac-app/Dockerfile"; then
            printf '%s\n' "$candidate"
            return 0
          fi
        done
        echo "Unable to locate NaC source checkout" >&2
        find . -maxdepth 2 -type d -name tests -print >&2 || true
        return 1
      }
      NAC_SOURCE_DIR="$(resolve_nac_source_dir)"
      echo "Using NaC source directory: $NAC_SOURCE_DIR"
      cd "$NAC_SOURCE_DIR"
      docker build -f deploy/functions/nac-app/Dockerfile -t nac-app .

outputArtifacts:
  - name: nac_app_image
    type: DOCKER_IMAGE
    location: nac-app

version: 1
status: mandatory

objective:
  reduce_agent_exploration_cost: true
  preserve_agent_context_quality: true
  enforce_deterministic_code_graph: true

schema: nac.graft-context-layer/v0.1

description: |
  Graft (https://github.com/NanoNets/Graft) ist der verbindliche
  Context-Layer für agentische Arbeit in NaC. Er baut einen
  deterministischen Code-Graphen (tree-sitter, kein LLM, kein Key)
  und macht ihn Coding-Agenten über die graft-CLI verfügbar, damit
  Agenten nicht bei jeder Aufgabe das Repo neu erkunden müssen.
  pi hat keinen eingebauten MCP-Support; Graft wird in pi über die
  CLI (bash-Tool) und den Skill 'graft-context' angebunden.

license:
  graft: MIT
  naC_integration: AGPL-3.0-or-later
  note: |
    Graft selbst ist MIT-lizenziert. Die NaC-Integration (Wiring,
    .gitignore, Policy, Quality-Gate-Check) steht unter
    AGPL-3.0-or-later nach policies/license-policy.yaml.
    Graft wird als externe Abhängigkeit (npm) genutzt, nicht
    als NaC-Code eingebettet.

tiers:
  tier_1_structural:
    description: Deterministischer tree-sitter Code-Graph (kein LLM, kein Key, $0).
    mandatory: true
    commands:
      - "graft build"
      - "graft check"
      - "graft ask"
      - "graft grep"
      - "graft callers"
      - "graft skeleton"
      - "graft map"
    network: false
    llm: false
    key_required: false

  tier_2_llm_summaries:
    description: LLM-generierte Konzept-Nodes und Symbol-Summaries.
    mandatory: false
    commands:
      - "graft build --deep"
    network: true
    llm: true
    key_required: true
    ai_sbom_relevant: true
    note: |
      Tier 2 ist optional. Wenn genutzt, muss der Provider
      im AI-SBOM nach policies/sbom-policy.yaml und
      docs/de/sbom-for-ai.md dokumentiert werden.

agent_integration:
  pi:
    method: cli_via_bash_and_skill
    config: .pi/settings.json
    skill: workflows/skills/graft-context/SKILL.md
    note: |
      pi hat keinen eingebauten MCP-Support (pi Settings-Schnittstelle
      hat kein mcpServers-Feld). Graft wird in pi daher über die
      graft-CLI im bash-Tool und den repo-lokalen Skill 'graft-context'
      angebunden, NICHT über einen MCP-Server. .pi/settings.json bindet
      den Skill unter 'skills' ein und enthält keinen 'mcpServers'-Schlüssel.
    tools:
      - graft build
      - graft check
      - graft ask
      - graft grep
      - graft callers
      - graft skeleton
      - graft map

  codex:
    method: agents_md_wiring
    command: "graft init --agents agents"
    note: |
      Schreibt einen marker-fenced Graft-Block in AGENTS.md.
      Optional: MCP-Server in ~/.codex/config.toml registrieren.

  claude_code:
    method: skill_and_hooks
    command: "graft init"
    note: |
      Schreibt .claude/skills/graft/SKILL.md, Statusline und Hooks.
      Nicht für NaC verpflichtend, aber kompatibel.

repo_integration:
  gitignore:
    entry: "graft/"
    note: |
      graft/ ist ein regenerierbarer lokaler Cache (wie node_modules)
      und wird nicht committed. Jeder Mitwirkende führt graft build
      aus um den eigenen Graphen zu erzeugen.

  not_committed:
    - "graft/"
    - "graft/.graph/wiring.json"
    - "graft/*.md"

  committed:
    - ".pi/settings.json (Skill-Eintrag graft-context, kein MCP)"
    - ".gitignore (graft/ Eintrag)"
    - "AGENTS.md (Graft-Block, falls graft init --agents agents)"
    - "workflows/skills/graft-context/SKILL.md (pi-Skill)"
    - "scripts/validate_graft_context_layer.py (Quality-Gate-Validator)"
    - "workflows/verification-contracts/graft-context-layer.verification.json"

quality_gate:
  check: "graft check"
  validator: scripts/validate_graft_context_layer.py
  description: |
    graft check ist ein $0 deterministischer Drift-Check.
    Er schlägt fehl (exit 1) wenn der lokale Graph vom
    Code abweicht. Der Check ruft kein LLM auf.
    Der Validator scripts/validate_graft_context_layer.py prüft zusätzlich
    die Verdrahtung (Policy, pi-Skill, AGENTS.md-Block, Startup, Quality-Gate)
    und laeuft im strict-Profil von scripts/quality_gate.py.
  profile: strict
  mandatory: true

startup:
  build: "graft build"
  script: scripts/startup_check.py
  description: |
    graft build (Tier 1) wird beim Startup (startup_check.py)
    ausgeführt um den Graphen zu erzeugen oder aufzufrischen,
    sobald die graft-CLI verfügbar ist. Kein Key, kein Netzwerk.
    Fehlt die graft-CLI im Base-Profil, ist das eine Warnung, kein Fehler;
    das strict-Quality-Gate macht graft check zur Pflicht.

data_boundary:
  forbid_secrets: true
  forbid_real_matter_data: true
  telemetry: false
  note: |
    Graft hat keine Telemetrie. Die einzigen Netzwerk-Calls
    sind LLM-Requests die in Tier 2 explizit konfiguriert
    werden. Tier 1 (Pflicht) hat kein Netzwerk.

platform_synchronity:
  - platform: pi
    path: .pi/settings.json
    mirror: .pi/README.md
  - platform: codex
    path: AGENTS.md
    mirror: .codex/agents/
  note: |
    Bei Änderungen an dieser Policy müssen alle Plattformpfade
    synchron gepflegt werden (pi, Codex, Claude Code).

version: 1
status: mandatory

approved_stack:
  documentation:
    canonical_format: markdown
    export:
      pdf: pandoc
      assets: svg_png
    notes:
      - "Markdown ist die einzig manuell gepflegte Quellform."
      - "AsciiDoc oder andere Formate dürfen nur als generierte Artefakte entstehen."
  process_logic:
    execution_language: python
    approach: model_first
    operating_surface: nac_cli
    cli_entrypoint: nac
    cli_wrapper: scripts/nac.py
    python_runtime_selection:
      scope: local_agent_checks
      codex_desktop_preferred: tool_discovered_bundled_python
      discovery_tool: load_workspace_dependencies
      explicit_project_environment: takes_precedence
      other_environments: verified_project_or_system_python
      executable_binding: absolute_path
      minimum_version: "3.11"
      smoke_test: version_and_required_imports
      keep_selected_runtime: true
      preserve_dependency_constraints: true
      retry_broken_path_python: false
      mutate_global_python_or_path: false
      auto_install_runtime_or_packages: false
      change_ci_or_release_runtime: false
    notes:
      - "Python implementiert Ausführung, Validierung und Integrationen."
      - "Fachlicher Ablauf wird primär als BPMN 2.0 modelliert."
      - "Neue NaC-Funktionalität muss über die zentrale nac-CLI erreichbar sein; direkte Skripte bleiben nur interne oder kompatible Bedienebenen."
      - "Für lokale Codex-Desktop-Prüfungen zuerst die aktuell über load_workspace_dependencies gemeldete Python-Laufzeit mit absolutem Pfad verwenden; eine ausdrücklich gebundene Projektumgebung hat Vorrang."
      - "Vor Nutzung Mindestversion, encodings/Standardbibliothek und benötigte Projektimporte prüfen; danach denselben Interpreter für Folgebefehle und Unterprozesse beibehalten."
      - "Ohne Codex-Discovery-Capability, insbesondere in pi oder CLI, eine vorhandene Projekt-/Systemlaufzeit genauso prüfen. Defektes PATH-Python nicht wiederholt starten, keine Laufzeit ungefragt installieren und globale Python-/PATH-Einstellungen nicht ändern."
      - "Diese Auswahlregel gilt nicht als Änderung oder Nachweis der explizit gebundenen CI-, Build-, Release-, SBOM- oder produktiven Laufzeit."
  visualization:
    canonical_business_model: bpmn_2_0
    canonical_source_format: bpmn_xml
    canonical_directory: bpmn/
    visual_editor: bpmn_js
    model_extension: bpmn/nac-moddle.json
    validator: scripts/validate_bpmn_models.py
    allowed_overview_format: mermaid
    disallowed_for_bpmn_source:
      - mermaid
      - plantuml
    notes:
      - "bpmn-js ist die geplante visuelle Bearbeitungsschicht für BPMN-2.0-Modelle."
      - "Python validiert BPMN-Modelle, NaC-Properties und bpmn-js-taugliche Profilmodelle vor Merge."
      - "Mermaid ist nur für Übersichtsdiagramme erlaubt."
      - "PlantUML ist optional für technische Architektur, nicht für BPMN-Quellen."

repository_constraints:
  enforce_codex_agent_sync: true
  active_ai_ide: codex
  cursor_workspace_files_allowed: false
  github_copilot_workspace_files_allowed: false
  required_sync_targets:
    - AGENTS.md
    - .codex/agents
    - docs/de/START_HERE.md
    - docs/en/START_HERE.md
    - policies/language-policy.yaml

exceptions:
  allowed: true
  process:
    - "Change Request mit Begründung"
    - "Bewertung durch Prozessverantwortliche"
    - "Dokumentierte Freigabe mit Versionshinweis"

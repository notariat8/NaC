version: 1
positioning:
  model: notariat_as_code
  operating_principle: enterprise_gitops
  implementation_label: nac
baseline:
  product_scope: notariat_only
  canonical_example_source: usecases
  legacy_process_fixtures_are_product_examples: false
  notarial_usecase_examples:
    - Immobilienkaufvertrag
    - Unterschriftsbeglaubigung
    - Online-GmbH-Gründung
    - Handelsregisteranmeldung
  required_controls:
    - pull_request
    - review
    - traceability
    - periodic_close
    - role_based_permissions
    - qualification_gates
notariat_scope:
  enabled: true
  prohibit_non_notarial_domain_sets: true
  canonical_usecase_catalog: usecases/README.md
  includes:
    - deed_preparation
    - identity_verification
    - execution_tracking
    - register_communication
    - signature_certification
    - notarial_cost_note_review
change_management:
  require_change_request: true
  require_impact_assessment: true
  require_version_bump: true
  require_commit_for_update_completion: true
  require_github_push_for_update_completion: true
  require_target_branch_merge_for_update_completion: false
  completion_target_branch: main
  completion_remote: github
  report_finished_only_after_target_branch_merge: false
  report_finished_only_after_target_branch_reaches_head: true
  finished_status_requires_clean_target_branch_workspace: true
  completion_requires_remote_ci_checks: true
  required_remote_ci_checks:
    - "Privacy and Secrets Guard / secret-scan"
    - "Privacy and Secrets Guard / privacy-lint"
    - "NaC Quality Gate / quality-gate"
  delivery_modes:
    protected_pr:
      target: production_forks_and_sensitive_process_changes
      require_branch: true
      require_pull_request: true
      require_review: true
      completion_requires_merge_to_target_branch: true
      completion_requires_remote_ci_checks: true
    owner_direct_main:
      target: active_reference_repo_when_owner_explicitly_requests_direct_delivery
      require_branch: false
      require_pull_request: false
      require_review: false
      completion_requires_push_to_target_branch: true
      completion_requires_strict_validation: true
      completion_requires_clean_workspace: true
      completion_requires_remote_ci_checks: true
  default_delivery_mode_for_production: protected_pr
  current_reference_repo_delivery_mode: owner_direct_main

rule_architecture:
  source_of_truth: policies/process-policy.yaml
  human_explanation_de: docs/de/regelarchitektur.md
  human_explanation_en: docs/en/regelarchitektur.md
  mirror_surfaces:
    - AGENTS.md
    - .codex/agents
    - docs/de/START_HERE.md
    - docs/en/START_HERE.md
  groups:
    completion_and_finished_state:
      hardness: hard
      enforced_by:
        - git status
        - git rev-parse HEAD
        - git rev-parse origin/main
        - remote_ci_checks
        - nac doctor --profile strict
    git_delivery:
      hardness: mode_dependent
      production_default: protected_pr
      active_reference_repo_default: owner_direct_main
    roadmap_and_gantt:
      hardness: guidance_plus_render_gate
      progress_picture_update_cadence: weekly
      immediate_update_when:
        - roadmap_changes
        - scope_changes
        - status_changes
        - milestone_changes
        - pilot_readiness_changes
        - active_build_board_changes
      enforced_by:
        - scripts/validate_gantt_progress.py
    language_and_localization:
      hardness: hard
      enforced_by:
        - scripts/validate_language_parity.py
    cli_and_operator_surface:
      hardness: hard_for_new_functionality
      enforced_by:
        - tests
        - nac doctor --profile strict
    data_protection_and_data_repo:
      hardness: hard
      enforced_by:
        - scripts/privacy_lint.py
        - "Privacy and Secrets Guard / secret-scan"
        - policies/data-protection-policy.yaml
    plugins_skills_and_agent_method:
      hardness: mixed
      enforced_by:
        - scripts/validate_plugins.py
        - scripts/install_local_plugins.py --mode link
    validation_and_doctor:
      hardness: hard
      enforced_by:
        - scripts/quality_gate.py

agent_workflows:
  require_plan_before_code_when_scope_is_open: true
  require_plan_review_fix_for_nontrivial_work: true
  require_implementation_review_before_user_acceptance: true
  require_final_response_next_step: true
  require_diagnosis_before_fix_for_repeated_or_unclear_failures: true
  require_full_pr_diff_review_before_merge: true
  routine_read_only_github_oci_checks_do_not_need_owner_approval: true
  parallel_gate_preparation_required_when_independent_inputs_known: true
  preserve_owner_gates_for:
    - design_approval
    - release_approval
    - apply_approval
    - secret_access
    - destructive_operation
  repeated_friction_optimization:
    enabled: true
    session_threshold: 2
    cross_issue_or_pr_threshold: 3
    triggers:
      - repeated_approval_request
      - repeated_error_path
      - repeated_work_interruption
      - repeated_sandbox_or_operator_friction
      - repeated_manual_retry_without_new_information
    required_action_before_retry:
      - stop_and_name_the_repeated_pattern
      - explain_why_the_current_rule_or_runbook_was_insufficient
      - propose_a_small_durable_optimization
      - state_whether_owner_design_or_apply_approval_is_required
    allowed_optimization_targets:
      - runbook
      - policy_rule
      - agent_mirror
      - approval_text
      - validator_or_test
      - command_prefix_request
      - tooling_wrapper
    allow_read_only_background_optimization_agent: true
    background_agent_limits:
      write_access: false
      oci_write_access: false
      may_propose_changes: true
      may_apply_changes_without_owner_approval: false
  release_memory:
    enabled: false
    status: archived_legacy_oci_release_lane
    skill_path: workflows/skills/nac-release-memory/SKILL.md
    dev_release_lane_context_pack: /home/ubuntu/src/oci-landing-zone/runbooks/release-lane-context.dev.json
    dev_release_lane_context_pack_review_url: https://github.com/notariat8/oci-landing-zone/blob/main/runbooks/release-lane-context.dev.json
    require_before_oci_release_work: false
    applies_to:
      - oci_devops
      - oci_functions
      - ocir
      - api_gateway
      - release_monitor
    require_commit_bound_release_lane: true
    require_nac_release_commit_build_argument: true
    commit_info_is_audit_only: true
    require_time_ledger_for_larger_release_blocks: true
    prohibit_broad_discovery_as_release_hotpath: true
    require_direct_prefix_compatible_read_only_hotpath: true
    dev_only_non_sensitive_context_pack_ocids_allowed: true
    prohibit_time_ledger_wrapper_for_remote_reads_when_prefix_mismatch: true
    require_observability_after_direct_read: true
    no_oci_apply_from_skill_without_owner_apply_approval: true
  require_layer_sync_check_for_data_controller_view_changes: true
  require_error_test_security_review_for_code_reviewer: true
  require_user_confirmation_before_code_for_ambiguous_requests: true
  final_response_next_step:
    required_even_when_work_is_complete: true
    must_state_owner_input_needed_or_not_needed: true
    must_name_concrete_next_engineering_or_operational_step: true
    must_not_end_with_ambiguous_waiting_state: true
  allow_direct_implementation_for_clear_small_changes: true
  require_tests_or_validation_evidence_for_code_changes: true
  prefer_test_checkpoint_before_non_trivial_implementation: true
  require_iteration_until_validation_passes: true
  require_visual_evidence_for_ui_changes: true
  require_clear_purpose_for_elevated_command_approval: true
  allow_codex_parallel_review_for_cross_layer_or_risky_changes: true
  codex_parallel_review_default_when_net_benefit_expected: true
  codex_parallel_review_assessment_dimensions:
    - layer_count
    - risk_level
    - independent_review_perspectives
    - validation_surface
    - coordination_cost
  codex_parallel_review_preserve_single_owner_for:
    - secrets
    - oci_write_actions
    - apply_gates
    - release_gates
    - destructive_operations
  codex_parallel_review_contract: workflows/contracts/codex-parallel-review.contract.json
  codex_parallel_review_doc_de: docs/de/codex-parallel-review-workflow.md
  codex_parallel_review_doc_en: docs/en/codex-parallel-review-workflow.md
  codex_parallel_review_profiles: .codex/agents
  codex_parallel_review_write_policy: read_only_specialists_lead_agent_or_user_approved_implementation

portfolio_structure:
  plugin_root: plugins
  workflow_root: workflows
  usecase_root: usecases
  separation_required: true
  tracks:
    plugins:
      purpose: installable_marketplace_and_workspace_packages
      gantt: plugins/GANTT.md
    workflows:
      purpose: installable_skills_and_deterministic_python_workflows
      gantt: workflows/GANTT.md
    usecases:
      purpose: concrete_notarial_business_scenarios
      gantt: usecases/GANTT.md

progress_tracking:
  global_gantt: roadmap/GANTT.md
  require_global_gantt_update_for_every_push: false
  require_global_gantt_update_for_roadmap_scope_or_status_changes: true
  require_area_gantt_update_for_area_scope_or_status_changes: true
  no_gantt_required_for_small_fixes_without_roadmap_impact: true
  trigger_examples:
    global_gantt:
      - new_or_removed_product_area
      - milestone_or_delivery_date_change
      - roadmap_status_or_progress_change
      - active_build_board_change
    area_gantt:
      - new_or_removed_plugin_workflow_or_usecase
      - area_status_or_progress_change
      - pilot_readiness_or_milestone_change
    no_gantt_required:
      - typo_fix
      - local_documentation_clarification_without_scope_change
      - validator_or_test_fix_without_scope_change
      - ui_detail_fix_without_status_change
  enforced_by: scripts/validate_gantt_progress.py
  validator_scope:
    - required_gantt_files_exist
    - mermaid_gantt_render_safety
    - guidance_for_possible_roadmap_or_area_updates

knowledge_graph:
  location: usecase_local
  required_files_per_usecase:
    - knowledge-graph.graph.json
    - knowledge-graph.md
  prohibit_central_knowledge_graph_root: true
  values_must_stay_empty_in_git: true
  enforced_by: scripts/validate_knowledge_graph.py

plugin_execution:
  local_workspace: ~/NaC
  omnistation_execution_allowed: false
  local_plugin_mirror:
    marketplace: ~/.agents/plugins/marketplace.json
    plugin_root: ~/plugins
    install_command: python scripts/install_local_plugins.py --mode link
    restart_required: true
  require_plan_preview: true
  require_human_review_before_execution: true
  require_audit_evidence: true
  require_day2_drift_handling: true
  require_plugin_manifest_validation: true
  plan_documentation_roots:
    - docs/de/plugin-plans
    - docs/en/plugin-plans

release_sync:
  upstream_sync_only_via_pull_request: true
  default_sync_cycle: monthly_or_quarterly
  require_upstream_release_reference: true

parallel_operation:
  bind_case_to_version_on_start: true
  running_cases_keep_bound_version: true
  require_exception_approval_for_rebinding: true

issue_governance:
  single_leading_issue_per_topic: true
  require_cross_repo_issue_links: true

github_first_operating_model:
  enabled: true
  project_owner: notariat8
  project_title: NaC Control Plane
  project_scope: organization
  project_required_for_nontrivial_work: true
  require_leading_issue_for_nontrivial_work: true
  require_project_fields_for_nontrivial_work: true
  allow_owner_direct_with_issue_project_trail: true
  completion_requires_remote_ci_checks: true
  forbid_secrets_and_matter_data_in_github_surfaces: true
  required_project_fields:
    - Status
    - Track
    - Work Type
    - Risk Gate
    - Delivery Mode
    - Priority
    - Size
    - Iteration
    - Due Date
  required_statuses:
    - Inbox
    - Ready
    - In Progress
    - Review
    - Blocked
    - Done
  required_views:
    - Owner Board
    - Now
    - Blocked
    - Governance And Security
    - Release Readiness
    - My Agent Work
  delivery_modes:
    - Owner Direct
    - Protected PR
    - Sync PR
  branch_prefixes:
    agent: "agent/<issue-number>-<short-slug>"
    sync: "sync/<issue-number>-<short-slug>"
    hotfix: "hotfix/<issue-number>-<short-slug>"

spec_traceability:
  enabled: true
  contract: workflows/contracts/spec-traceability.contract.json
  manifest_block: nac-spec-traceability
  require_acceptance_ids_for_nontrivial_specs: true
  require_validation_commands_for_nontrivial_specs: true
  allow_historical_specs_without_manifest: true
  applies_to:
    - docs/de/superpowers/specs
    - docs/en/superpowers/specs
    - .github/ISSUE_TEMPLATE
    - .github/PULL_REQUEST_TEMPLATE.md
  required_manifest_fields:
    - schema_version
    - spec_id
    - leading_issue
    - risk_gate
    - delivery_mode
    - acceptance_ids
    - validation_commands
  enforced_by:
    - scripts/validate_spec_traceability.py

documentation_links:
  require_markdown_links_for_repo_references: true
  applies_to:
    - readme_files
    - start_here_documents
    - agent_rule_surfaces
  path_references_should_be_clickable: true
  allowed_code_spans:
    - commands
    - configuration_keys
    - file_patterns
    - code_identifiers
  enforced_by: scripts/validate_doc_links.py

operating_cadence:
  default_method: agile
  allowed_methods:
    - agile
    - kanban
  allowed_sprint_durations:
    - 1w
    - 2w
    - 4w
  allowed_daily_durations:
    - 5m
    - 10m
    - 20m
  allowed_kanban_review_cadences:
    - 1w
    - 2w
    - 4w
  allowed_kanban_sync_durations:
    - 5m
    - 10m
    - 20m

role_model:
  required_policy: policies/role-model-policy.yaml
  everyone_can_open_ticket: true
